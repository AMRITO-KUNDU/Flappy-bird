<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Flappy Bird</title>
    <meta name="description" content="A modern Flappy Bird clone built with HTML5 Canvas. Includes audio toggles, pause, medals, and saved best score.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="game-container" id="gameRoot">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <button id="btnMenu" class="hud-btn" type="button" aria-label="Menu">MENU</button>
            </div>

            <div id="start-screen" class="screen">
                <div class="start-minimal">
                    <div class="menu-buttons">
                        <button id="btnStart" class="retro-btn primary" type="button">PLAY</button>
                        <button id="btnMarketplaceStart" class="retro-btn" type="button">MARKETPLACE</button>
                    </div>
                </div>
            </div>

            <div id="game-screen" class="screen hidden">
                <div id="score">0</div>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <div class="panel panel-gameover">
                    <div class="subtitle gameover">GAME OVER</div>

                    <div class="scoreboard">
                        <div class="score-row">
                            <span class="label">SCORE</span>
                            <span id="finalScore" class="value">0</span>
                        </div>
                        <div class="score-row">
                            <span class="label">BEST</span>
                            <span id="bestScore" class="value">0</span>
                        </div>
                        <div class="medal-container">
                            <div id="medal" class="hidden"></div>
                        </div>
                    </div>

                    <div class="menu-buttons">
                        <button id="btnRetry" class="retro-btn primary" type="button">RETRY</button>
                        <button id="btnHomeFromOver" class="retro-btn" type="button">HOME</button>
                    </div>
                </div>
            </div>

            <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Settings">
                <div class="modal-backdrop" data-close="true"></div>
                <div class="modal-card">
                    <div class="modal-header">
                        <div class="modal-title">PAUSED</div>
                        <button id="btnCloseSettings" class="hud-btn modal-close" type="button" aria-label="Close settings">X</button>
                    </div>

                    <div class="modal-body">
                        <div class="pause-actions">
                            <button id="btnResume" class="retro-btn primary" type="button">RESUME</button>
                            <button id="btnRestart" class="retro-btn" type="button">RESTART</button>
                            <button id="btnOpenMarketplace" class="retro-btn" type="button">MARKETPLACE</button>
                        </div>
                        <div class="modal-section">
                            <div class="settings-title">AUDIO</div>
                            <label class="setting-row">
                                <span class="setting-label">SFX</span>
                                <input id="settingSfx" class="toggle" type="checkbox" checked>
                            </label>
                            <label class="setting-row">
                                <span class="setting-label">MUSIC</span>
                                <input id="settingMusic" class="toggle" type="checkbox">
                            </label>
                            <label class="setting-row">
                                <span class="setting-label">MUTE</span>
                                <input id="settingMute" class="toggle" type="checkbox">
                            </label>
                        </div>

                    </div>
                </div>
            </div>

            <div id="marketplace-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Marketplace">
                <div class="modal-backdrop" data-close="true"></div>
                <div class="modal-card">
                    <div class="modal-header">
                        <div class="modal-title">MARKETPLACE</div>
                        <button id="btnCloseMarketplace" class="hud-btn modal-close" type="button" aria-label="Close marketplace">X</button>
                    </div>

                    <div class="modal-body">
                        <div class="wallet">
                            <span class="wallet-label">COINS</span>
                            <span id="walletCoins" class="wallet-value">0</span>
                        </div>

                        <div class="modal-section">
                            <div class="settings-title">BACKGROUND</div>
                            <label class="setting-row">
                                <span class="setting-label">DAY/NIGHT</span>
                                <select id="settingTheme" class="select">
                                    <option value="day">DAY</option>
                                    <option value="night">NIGHT</option>
                                    <option value="sunset">SUNSET</option>
                                    <option value="storm">STORM</option>
                                </select>
                            </label>
                        </div>

                        <div class="modal-section">
                            <div class="settings-title">WEATHER</div>
                            <label class="setting-row">
                                <span class="setting-label">FX</span>
                                <select id="settingWeather" class="select">
                                    <option value="none">NONE</option>
                                    <option value="rain">RAIN</option>
                                    <option value="snow">SNOW</option>
                                </select>
                            </label>
                        </div>

                        <div class="modal-section">
                            <div class="settings-title">BIRD</div>
                            <label class="setting-row">
                                <span class="setting-label">SKIN</span>
                                <select id="settingBirdSkin" class="select"></select>
                            </label>
                        </div>

                        <div class="modal-section">
                            <div class="settings-title">TRAIL</div>
                            <label class="setting-row">
                                <span class="setting-label">TYPE</span>
                                <select id="settingTrail" class="select"></select>
                            </label>
                        </div>

                        <div class="modal-actions">
                            <button id="btnBuySelected" class="retro-btn primary" type="button">BUY / EQUIP</button>
                        </div>

                        <div class="modal-actions">
                            <button id="btnBackToSettings" class="retro-btn secondary" type="button">BACK</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/game.js"></script>
</body>
</html>
