<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Flappy Bird</title>
    <meta name="description" content="A modern Flappy Bird clone built with HTML5 Canvas. Includes audio toggles, pause, medals, and saved best score.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="game-container" id="gameRoot">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <!-- HUD - repositioned for better layout -->
            <div id="hud">
                <button id="btnMenu" class="hud-btn" type="button" aria-label="Menu">
                    <span class="hud-icon">☰</span>
                </button>
            </div>

            <!-- Power-up indicator -->
            <div id="powerUpIndicator" class="power-up-indicator hidden">
                <div class="power-up-content">
                    <span class="power-up-icon"></span>
                    <span class="power-up-name"></span>
                </div>
                <div class="power-up-bar-container">
                    <div class="power-up-bar"></div>
                </div>
            </div>

            <!-- Start Screen - with title -->
            <div id="start-screen" class="screen">
                <div class="start-content">
                    <div class="title-section">
                        <h1 class="game-title">FLAPPY<br>BIRD</h1>
                    </div>
                    <div class="start-buttons">
                        <button id="btnStart" class="retro-btn primary" type="button">PLAY</button>
                        <button id="btnMarketplaceStart" class="retro-btn secondary" type="button">
                            <span class="btn-icon">🛒</span> SHOP
                        </button>
                    </div>
                    <div class="start-hint">
                        <span class="hint-text">TAP OR SPACE TO FLY</span>
                    </div>
                </div>
            </div>

            <!-- Game Screen - score centered -->
            <div id="game-screen" class="screen hidden">
                <div id="score" class="game-score">0</div>
            </div>

            <!-- Game Over Screen - improved layout -->
            <div id="game-over-screen" class="screen hidden">
                <div class="game-over-panel">
                    <div class="game-over-header">
                        <span class="game-over-icon">💀</span>
                        <h2 class="game-over-title">GAME OVER</h2>
                    </div>

                    <div class="score-section">
                        <div class="medal-display">
                            <div id="medal" class="medal hidden"></div>
                        </div>
                        <div class="score-box">
                            <div class="score-item">
                                <span class="score-label">SCORE</span>
                                <span id="finalScore" class="score-value">0</span>
                            </div>
                            <div class="score-divider"></div>
                            <div class="score-item">
                                <span class="score-label">BEST</span>
                                <span id="bestScore" class="score-value best">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="game-over-actions">
                        <button id="btnRetry" class="retro-btn primary" type="button">RETRY</button>
                        <button id="btnHomeFromOver" class="retro-btn secondary" type="button">HOME</button>
                    </div>
                </div>
            </div>

            <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Settings">
                <div class="modal-backdrop" data-close="true"></div>
                <div class="modal-card">
                    <div class="modal-header">
                        <div class="modal-title">PAUSED</div>
                        <button id="btnCloseSettings" class="hud-btn modal-close" type="button" aria-label="Close settings">X</button>
                    </div>

                    <div class="modal-body">
                        <div class="pause-actions">
                            <button id="btnResume" class="retro-btn primary" type="button">RESUME</button>
                            <button id="btnRestart" class="retro-btn" type="button">RESTART</button>
                            <button id="btnOpenMarketplace" class="retro-btn" type="button">MARKETPLACE</button>
                        </div>
                        <div class="modal-section">
                            <div class="settings-title">AUDIO</div>
                            <label class="setting-row">
                                <span class="setting-label">SFX</span>
                                <input id="settingSfx" class="toggle" type="checkbox" checked>
                            </label>
                            <label class="setting-row">
                                <span class="setting-label">MUSIC</span>
                                <input id="settingMusic" class="toggle" type="checkbox">
                            </label>
                            <label class="setting-row">
                                <span class="setting-label">MUTE</span>
                                <input id="settingMute" class="toggle" type="checkbox">
                            </label>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Marketplace - Redesigned with proper grid layout -->
            <div id="marketplace-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Marketplace">
                <div class="modal-backdrop" data-close="true"></div>
                <div class="modal-card marketplace-card">
                    <div class="modal-header">
                        <div class="modal-title">🛒 MARKETPLACE</div>
                        <button id="btnCloseMarketplace" class="hud-btn modal-close" type="button" aria-label="Close marketplace">✕</button>
                    </div>

                    <div class="modal-body">
                        <!-- Wallet -->
                        <div class="wallet">
                            <span class="wallet-label">💰 COINS</span>
                            <span id="walletCoins" class="wallet-value">0</span>
                        </div>

                        <!-- Bird Skins Section -->
                        <div class="shop-section">
                            <div class="section-header">
                                <span class="section-icon">🐦</span>
                                <span class="section-name">BIRD SKINS</span>
                            </div>
                            <div id="skinsGrid" class="items-grid">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Trails Section -->
                        <div class="shop-section">
                            <div class="section-header">
                                <span class="section-icon">✨</span>
                                <span class="section-name">TRAILS</span>
                            </div>
                            <div id="trailsGrid" class="items-grid">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Themes Section -->
                        <div class="shop-section">
                            <div class="section-header">
                                <span class="section-icon">🎨</span>
                                <span class="section-name">THEMES</span>
                            </div>
                            <div id="themesGrid" class="items-grid">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Weather Section -->
                        <div class="shop-section">
                            <div class="section-header">
                                <span class="section-icon">🌦️</span>
                                <span class="section-name">WEATHER</span>
                            </div>
                            <div id="weatherGrid" class="items-grid">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <div class="modal-actions">
                            <button id="btnBackToSettings" class="retro-btn secondary" type="button">← BACK</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/game.js"></script>
</body>
</html>
