<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Flappy Bird</title>
    <meta name="description" content="A modern Flappy Bird clone built with HTML5 Canvas. Includes audio toggles, pause, medals, and saved best score.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/style.css">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="game-container" id="gameRoot">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <button id="btnPause" class="hud-btn" type="button" aria-label="Pause">PAUSE</button>
                <button id="btnSettings" class="hud-btn" type="button" aria-label="Settings">SET</button>
            </div>

            <div id="start-screen" class="screen">
                <div class="message-box">
                    <div class="get-ready">FLAPPY BIRD</div>

                    <button id="btnStart" class="retro-btn" type="button">START</button>

                    <div class="controls-hint">SPACE / CLICK / TAP · P TO PAUSE · M TO MUTE</div>
                </div>
            </div>

            <div id="game-screen" class="screen hidden">
                <div id="score">0</div>
            </div>

            <div id="pause-screen" class="screen hidden">
                <div class="message-box pause-box">
                    <div class="get-ready">PAUSED</div>
                    <div class="tap-instruction">
                        <div class="tap-text">PRESS P / TAP TO RESUME</div>
                    </div>
                </div>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <div class="game-over-box">
                    <div class="game-over-title">Game Over</div>
                    <div class="score-panel">
                        <div class="score-row">
                            <span class="label">Score</span>
                            <span id="finalScore" class="value">0</span>
                        </div>
                        <div class="score-row">
                            <span class="label">Best</span>
                            <span id="bestScore" class="value">0</span>
                        </div>
                        <div class="medal-container">
                            <div id="medal" class="hidden"></div>
                        </div>
                    </div>
                    <div class="tap-to-retry">
                        <div class="tap-icon small"></div>
                        <p>TAP / R TO RETRY</p>
                    </div>
                </div>
            </div>

            <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Settings">
                <div class="modal-backdrop" data-close="true"></div>
                <div class="modal-card">
                    <div class="modal-header">
                        <div class="modal-title">SETTINGS</div>
                        <button id="btnCloseSettings" class="hud-btn modal-close" type="button" aria-label="Close settings">X</button>
                    </div>

                    <div class="modal-body">
                        <div class="modal-section">
                            <div class="settings-title">AUDIO</div>
                            <label class="setting-row">
                                <span class="setting-label">SFX</span>
                                <input id="settingSfx" class="toggle" type="checkbox" checked>
                            </label>
                            <label class="setting-row">
                                <span class="setting-label">MUSIC</span>
                                <input id="settingMusic" class="toggle" type="checkbox">
                            </label>
                            <label class="setting-row">
                                <span class="setting-label">MUTE</span>
                                <input id="settingMute" class="toggle" type="checkbox">
                            </label>
                        </div>

                        <div class="modal-section">
                            <div class="settings-title">THEME</div>
                            <label class="setting-row">
                                <span class="setting-label">SKIN</span>
                                <select id="settingTheme" class="select">
                                    <option value="day">DAY</option>
                                    <option value="night">NIGHT</option>
                                    <option value="sunset">SUNSET</option>
                                    <option value="storm">STORM</option>
                                </select>
                            </label>
                        </div>

                        <div class="modal-section">
                            <div class="settings-title">WEATHER</div>
                            <label class="setting-row">
                                <span class="setting-label">FX</span>
                                <select id="settingWeather" class="select">
                                    <option value="none">NONE</option>
                                    <option value="rain">RAIN</option>
                                    <option value="snow">SNOW</option>
                                </select>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/game.js"></script>
</body>
</html>
