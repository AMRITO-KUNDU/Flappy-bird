<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Flappy Bird</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <div class="message-box">
                    <div class="get-ready">FLAPPY BIRD</div>
                    <div class="tap-instruction">
                        <div class="tap-hand"></div>
                        <div class="tap-text">START</div>
                    </div>
                </div>
            </div>
            <div id="game-screen" class="screen hidden">
                <div id="score">0</div>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <div class="game-over-box">
                    <div class="game-over-title">Game Over</div>
                    <div class="score-panel">
                        <div class="score-row">
                            <span class="label">Score</span>
                            <span id="finalScore" class="value">0</span>
                        </div>
                        <div class="score-row">
                            <span class="label">Best</span>
                            <span id="bestScore" class="value">0</span>
                        </div>
                        <div class="medal-container">
                            <div id="medal" class="hidden"></div>
                        </div>
                    </div>
                    <div class="tap-to-retry">
                        <div class="tap-icon small"></div>
                        <p>TAP TO RETRY</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
